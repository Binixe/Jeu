<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#dff4e8" />
		<title>Petit Slime</title>
		<style>
			:root {
				color-scheme: light;
				background: #dff4e8;
				font-family: "Trebuchet MS", "Avenir Next", sans-serif;
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				overflow: hidden;
			}

			body {
				background:
					radial-gradient(ellipse at 50% 45%, rgba(255, 255, 255, 0.78), transparent 36%),
					radial-gradient(ellipse at 18% 82%, rgba(255, 188, 143, 0.32), transparent 32%),
					linear-gradient(145deg, #dff4e8 0%, #c6e9e3 48%, #f6e8cd 100%);
			}

			main {
				position: relative;
				width: 100%;
				height: 100%;
				isolation: isolate;
			}

			main::before {
				position: absolute;
				z-index: -1;
				inset: 0;
				background-image: radial-gradient(rgba(38, 91, 77, 0.12) 1px, transparent 1px);
				background-position: center;
				background-size: 30px 30px;
				content: "";
				mask-image: radial-gradient(ellipse at center, black 0%, transparent 76%);
			}

			canvas {
				position: absolute;
				z-index: 0;
				inset: 0;
				display: block;
				width: 100%;
				height: 100%;
				touch-action: none;
				cursor: crosshair;
			}

			.camera-control {
				position: absolute;
				z-index: 2;
				top: 22px;
				right: 22px;
				display: grid;
				width: 46px;
				aspect-ratio: 1;
				place-items: center;
				border: 1px solid rgba(47, 92, 75, 0.24);
				border-radius: 50%;
				background: rgba(248, 255, 248, 0.72);
				color: #315d4c;
				cursor: pointer;
				backdrop-filter: blur(8px);
				transition: background 160ms ease, color 160ms ease, transform 160ms ease;
			}

			.camera-modes {
				position: absolute;
				z-index: 2;
				top: 18px;
				left: 18px;
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				width: min(390px, calc(100vw - 88px));
				padding: 4px;
				border: 1px solid rgba(47, 92, 75, 0.18);
				border-radius: 9px;
				background: rgba(248, 255, 248, 0.78);
				backdrop-filter: blur(8px);
			}

			.camera-mode-option {
				display: grid;
				min-width: 0;
				min-height: 38px;
				place-content: center;
				gap: 2px;
				border: 0;
				border-radius: 6px;
				background: transparent;
				color: #466c5a;
				cursor: pointer;
				font: inherit;
				transition: background 150ms ease, color 150ms ease;
			}

			.camera-mode-option:hover {
				background: rgba(49, 93, 76, 0.1);
			}

			.camera-mode-option[aria-pressed="true"] {
				background: #315d4c;
				color: #f5fff3;
			}

			.camera-mode-key {
				font-size: 9px;
				font-weight: 700;
				line-height: 1;
				opacity: 0.76;
			}

			.camera-mode-name {
				font-size: 11px;
				font-weight: 700;
				line-height: 1.15;
				color: #315d4c;
			}

			.camera-mode-option[aria-pressed="true"] .camera-mode-name {
				color: inherit;
			}

			.camera-mode-option:focus-visible,
			.camera-control:focus-visible {
				outline: 2px solid #e08b68;
				outline-offset: 2px;
			}

			.camera-control:hover {
				transform: scale(1.06);
			}

			.camera-control.is-active {
				background: #315d4c;
				color: #f5fff3;
			}

			.camera-control span {
				position: relative;
				width: 16px;
				height: 16px;
				border: 1.5px solid currentColor;
				border-radius: 50%;
			}

			.camera-control span::before,
			.camera-control span::after {
				position: absolute;
				top: 50%;
				left: 50%;
				background: currentColor;
				content: "";
				transform: translate(-50%, -50%);
			}

			.camera-control span::before {
				width: 26px;
				height: 1px;
			}

			.camera-control span::after {
				width: 1px;
				height: 26px;
			}

			.aim-reticle {
				position: absolute;
				z-index: 1;
				top: 50%;
				left: 50%;
				width: 9px;
				height: 9px;
				border: 1px solid rgba(37, 76, 62, 0.76);
				border-radius: 50%;
				box-shadow: 0 0 0 2px rgba(245, 255, 244, 0.48);
				pointer-events: none;
				transform: translate(-50%, -50%);
			}

			@media (max-width: 600px) {
				.camera-modes {
					top: auto;
					right: 14px;
					bottom: 16px;
					left: 14px;
					width: auto;
				}

				.camera-mode-option {
					min-height: 42px;
				}

				.camera-control {
					top: 16px;
					right: 16px;
				}
			}
		</style>
	</head>
	<body>
		<main aria-label="Jeu en vue troisième personne">
			<canvas id="scene"></canvas>
			<div class="aim-reticle" aria-hidden="true"></div>
			<div class="camera-modes" role="group" aria-label="Angle de caméra">
				<button class="camera-mode-option" type="button" data-camera-mode="1" aria-pressed="false" title="Vue première personne">
					<span class="camera-mode-key">1</span><span class="camera-mode-name">FPS</span>
				</button>
				<button class="camera-mode-option" type="button" data-camera-mode="2" aria-pressed="true" title="Vue troisième personne">
					<span class="camera-mode-key">2</span><span class="camera-mode-name">TPS</span>
				</button>
				<button class="camera-mode-option" type="button" data-camera-mode="3" aria-pressed="false" title="Vue isométrique">
					<span class="camera-mode-key">3</span><span class="camera-mode-name">ISO</span>
				</button>
				<button class="camera-mode-option" type="button" data-camera-mode="4" aria-pressed="false" title="Vue défilement latéral">
					<span class="camera-mode-key">4</span><span class="camera-mode-name">LAT</span>
				</button>
			</div>
			<button class="camera-control" id="camera-control" type="button" title="Activer le contrôle de la souris" aria-label="Activer le contrôle de la souris">
				<span aria-hidden="true"></span>
			</button>
		</main>
		<script type="module">
			import * as THREE from "/node_modules/three/build/three.module.js";

			const canvas = document.querySelector("#scene");
			const scene = new THREE.Scene();
			const fpsCamera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
			const perspectiveCamera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
			const orthographicCamera = new THREE.OrthographicCamera(-2, 2, 2, -2, 0.1, 100);
			let camera = perspectiveCamera;
			const cameraControl = document.querySelector("#camera-control");
			const cameraModeButtons = [...document.querySelectorAll("[data-camera-mode]")];
			const aimReticle = document.querySelector(".aim-reticle");
			const cameraState = { mode: 2, yaw: Math.PI, pitch: 0.2, distance: 5.2, baseDistance: 5.2 };
			const pressedKeys = new Set();
			const movementVelocity = new THREE.Vector3();
			const desiredVelocity = new THREE.Vector3();
			let dragPointer = null;

			const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
			renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
			renderer.outputColorSpace = THREE.SRGBColorSpace;
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			renderer.toneMappingExposure = 1.15;

			scene.add(new THREE.HemisphereLight(0xf4fff5, 0x729d86, 2.2));

			const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
			keyLight.position.set(-3, 5, 6);
			scene.add(keyLight);

			const rimLight = new THREE.DirectionalLight(0xffb88f, 2.5);
			rimLight.position.set(4, 1, -3);
			scene.add(rimLight);

			const ground = new THREE.Mesh(
				new THREE.PlaneGeometry(120, 120),
				new THREE.MeshBasicMaterial({ color: 0x9fc9b1, transparent: true, opacity: 0.14, depthWrite: false }),
			);
			ground.rotation.x = -Math.PI / 2;
			ground.position.y = -1.14;
			scene.add(ground);

			const groundGrid = new THREE.GridHelper(120, 60, 0x6f9c84, 0x88af99);
			groundGrid.position.y = -1.13;
			for (const material of Array.isArray(groundGrid.material) ? groundGrid.material : [groundGrid.material]) {
				material.transparent = true;
				material.opacity = 0.16;
				material.depthWrite = false;
			}
			scene.add(groundGrid);

			const markerRingMaterial = new THREE.MeshStandardMaterial({ color: 0xe59a75, emissive: 0x5d2917, emissiveIntensity: 0.12, roughness: 0.42 });
			const markerCoreMaterial = new THREE.MeshStandardMaterial({ color: 0xf3dc9f, emissive: 0x624b1d, emissiveIntensity: 0.1, roughness: 0.38 });
			function addAimMarker(x, y, z, scale) {
				const marker = new THREE.Group();
				marker.position.set(x, y, z);
				marker.scale.setScalar(scale);
				const ring = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.055, 12, 32), markerRingMaterial);
				marker.add(ring);
				const core = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 18), markerCoreMaterial);
				marker.add(core);
				scene.add(marker);
			}

			addAimMarker(0, 0.3, 8, 1);
			addAimMarker(-3.2, 0.55, 12, 0.8);
			addAimMarker(3.4, 0.4, 15, 1.1);

			const slime = new THREE.Group();
			scene.add(slime);
			fpsCamera.position.set(0, 0.18, 0);
			fpsCamera.rotation.order = "YXZ";
			slime.add(fpsCamera);

			const bodyMaterial = new THREE.MeshPhysicalMaterial({
				color: 0x8cdb77,
				roughness: 0.2,
				metalness: 0.02,
				clearcoat: 0.85,
				clearcoatRoughness: 0.14,
			});
			const bodyProfile = new THREE.CatmullRomCurve3([
				new THREE.Vector3(0, -1.02, 0),
				new THREE.Vector3(0.7, -1.02, 0),
				new THREE.Vector3(1.02, -0.82, 0),
				new THREE.Vector3(1.1, -0.42, 0),
				new THREE.Vector3(1.04, 0.08, 0),
				new THREE.Vector3(0.88, 0.57, 0),
				new THREE.Vector3(0.56, 0.94, 0),
				new THREE.Vector3(0, 1.08, 0),
			]);
			const body = new THREE.Mesh(
				new THREE.LatheGeometry(bodyProfile.getPoints(64).map((point) => new THREE.Vector2(point.x, point.y)), 64),
				bodyMaterial,
			);
			body.scale.z = 0.76;
			slime.add(body);

			const armMaterial = bodyMaterial;
			const armPivots = [];
			for (const side of [-1, 1]) {
				const armPivot = new THREE.Group();
				armPivot.position.set(side * 0.88, -0.36, 0.03);
				slime.add(armPivot);
				armPivots.push({ group: armPivot, side });

				const armCurve = new THREE.CatmullRomCurve3([
					new THREE.Vector3(0, 0.06, 0),
					new THREE.Vector3(side * 0.22, -0.04, 0.06),
					new THREE.Vector3(side * 0.34, -0.2, 0.11),
					new THREE.Vector3(side * 0.48, -0.17, 0.14),
				]);
				const arm = new THREE.Mesh(new THREE.TubeGeometry(armCurve, 24, 0.105, 12, false), armMaterial);
				armPivot.add(arm);

				const hand = new THREE.Mesh(new THREE.SphereGeometry(0.125, 24, 16), armMaterial);
				hand.position.set(side * 0.48, -0.17, 0.14);
				hand.scale.set(1.08, 0.92, 0.9);
				armPivot.add(hand);
			}

			const face = new THREE.Group();
			slime.add(face);

			const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.24 });
			const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x24453c, roughness: 0.18 });
			for (const x of [-0.34, 0.34]) {
				const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 32, 24), eyeWhite);
				eye.position.set(x, 0.18, 0.72);
				eye.scale.set(0.82, 1.08, 0.52);
				face.add(eye);

				const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.082, 24, 18), pupilMaterial);
				pupil.position.set(x + 0.025, 0.16, 0.81);
				face.add(pupil);

				const glint = new THREE.Mesh(
					new THREE.SphereGeometry(0.027, 16, 12),
					new THREE.MeshBasicMaterial({ color: 0xffffff }),
				);
				glint.position.set(x + 0.045, 0.2, 0.88);
				face.add(glint);
			}

			const smileCurve = new THREE.QuadraticBezierCurve3(
				new THREE.Vector3(-0.15, -0.08, 0.79),
				new THREE.Vector3(0, -0.2, 0.84),
				new THREE.Vector3(0.15, -0.08, 0.79),
			);
			const smile = new THREE.Mesh(
				new THREE.TubeGeometry(smileCurve, 20, 0.025, 8, false),
				new THREE.MeshStandardMaterial({ color: 0x426c48, roughness: 0.4 }),
			);
			face.add(smile);

			const shadow = new THREE.Mesh(
				new THREE.CircleGeometry(1, 64),
				new THREE.MeshBasicMaterial({ color: 0x547b70, transparent: true, opacity: 0.14, depthWrite: false }),
			);
			shadow.rotation.x = -Math.PI / 2;
			shadow.position.set(0, -1.08, 0);
			shadow.scale.set(1.35, 0.46, 1);
			slime.add(shadow);

			function resize() {
				const width = window.innerWidth;
				const height = window.innerHeight;
				const aspect = width / height;
				fpsCamera.aspect = aspect;
				perspectiveCamera.aspect = aspect;
				const horizontalSpace = 3.8 / (2 * Math.tan(THREE.MathUtils.degToRad(perspectiveCamera.fov / 2)) * aspect);
				cameraState.baseDistance = Math.max(5.8, horizontalSpace);
				cameraState.distance = cameraState.baseDistance;
				fpsCamera.updateProjectionMatrix();
				perspectiveCamera.updateProjectionMatrix();
				const frustumHeight = Math.max(3.2, 3.8 / aspect);
				orthographicCamera.left = -frustumHeight * aspect / 2;
				orthographicCamera.right = frustumHeight * aspect / 2;
				orthographicCamera.top = frustumHeight / 2;
				orthographicCamera.bottom = -frustumHeight / 2;
				orthographicCamera.updateProjectionMatrix();
				renderer.setSize(width, height, false);
			}

			window.addEventListener("resize", resize);
			resize();

			function setCameraMode(mode) {
				cameraState.mode = mode;
				camera = mode === 1 ? fpsCamera : mode >= 3 ? orthographicCamera : perspectiveCamera;
				body.visible = mode !== 1;
				face.visible = mode !== 1;
				for (const arm of armPivots) arm.group.visible = mode !== 1;
				shadow.visible = mode !== 1;
				for (const button of cameraModeButtons) {
					button.setAttribute("aria-pressed", String(Number(button.dataset.cameraMode) === mode));
				}
				aimReticle.hidden = mode >= 3;

				if (mode === 1) {
					cameraState.yaw = slime.rotation.y + Math.PI;
					cameraState.pitch = 0;
				} else if (mode === 2) {
					cameraState.yaw = slime.rotation.y + Math.PI;
					cameraState.pitch = 0.2;
					cameraState.distance = cameraState.baseDistance;
				} else if (mode === 3) {
					cameraState.yaw = Math.PI / 4;
					orthographicCamera.zoom = 0.68;
					orthographicCamera.updateProjectionMatrix();
				} else {
					cameraState.yaw = Math.PI;
					slime.rotation.y = Math.PI / 3;
					orthographicCamera.zoom = 1;
					orthographicCamera.updateProjectionMatrix();
				}
			}

			for (const button of cameraModeButtons) {
				button.addEventListener("click", () => setCameraMode(Number(button.dataset.cameraMode)));
			}

			function rotateCamera(deltaX, deltaY) {
				if (cameraState.mode >= 3) return;
				cameraState.yaw -= deltaX * 0.0025;
				const minPitch = cameraState.mode === 1 ? -0.65 : 0.03;
				const maxPitch = cameraState.mode === 1 ? 0.65 : 0.78;
				cameraState.pitch = THREE.MathUtils.clamp(cameraState.pitch + deltaY * 0.002, minPitch, maxPitch);
			}

			function requestMouseLock() {
				if (typeof canvas.requestPointerLock !== "function") return;
				const lockRequest = canvas.requestPointerLock();
				if (lockRequest?.catch) lockRequest.catch(() => {});
			}

			cameraControl.addEventListener("click", requestMouseLock);
			canvas.addEventListener("click", requestMouseLock);
			document.addEventListener("pointerlockchange", () => {
				cameraControl.classList.toggle("is-active", document.pointerLockElement === canvas);
			});
			document.addEventListener("mousemove", (event) => {
				if (document.pointerLockElement === canvas) rotateCamera(event.movementX, event.movementY);
			});

			canvas.addEventListener("pointerdown", (event) => {
				if (event.pointerType === "touch" || (event.pointerType === "mouse" && document.pointerLockElement !== canvas)) {
					dragPointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
					canvas.setPointerCapture(event.pointerId);
				}
			});
			canvas.addEventListener("pointermove", (event) => {
				if (dragPointer?.id !== event.pointerId) return;
				rotateCamera(event.clientX - dragPointer.x, event.clientY - dragPointer.y);
				dragPointer.x = event.clientX;
				dragPointer.y = event.clientY;
			});
			canvas.addEventListener("pointerup", () => { dragPointer = null; });
			canvas.addEventListener("pointercancel", () => { dragPointer = null; });
			canvas.addEventListener("wheel", (event) => {
				if (cameraState.mode >= 3) {
					orthographicCamera.zoom = THREE.MathUtils.clamp(orthographicCamera.zoom * Math.exp(-event.deltaY * 0.001), 0.4, 2.5);
					orthographicCamera.updateProjectionMatrix();
				} else {
					cameraState.distance = THREE.MathUtils.clamp(
						cameraState.distance + event.deltaY * 0.008,
						cameraState.baseDistance * 0.82,
						cameraState.baseDistance + 4,
					);
				}
			}, { passive: true });

			const movementKeys = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"]);
			const cameraModes = new Map([["Digit1", 1], ["Digit2", 2], ["Digit3", 3], ["Digit4", 4]]);
			window.addEventListener("keydown", (event) => {
				const selectedMode = cameraModes.get(event.code);
				if (selectedMode) {
					event.preventDefault();
					if (!event.repeat) setCameraMode(selectedMode);
					return;
				}
				if (!movementKeys.has(event.code)) return;
				event.preventDefault();
				pressedKeys.add(event.code);
			});
			window.addEventListener("keyup", (event) => { pressedKeys.delete(event.code); });
			window.addEventListener("blur", () => pressedKeys.clear());

			function moveSlime(delta) {
				const forward = Number(pressedKeys.has("KeyW") || pressedKeys.has("ArrowUp")) - Number(pressedKeys.has("KeyS") || pressedKeys.has("ArrowDown"));
				const sideways = Number(pressedKeys.has("KeyD") || pressedKeys.has("ArrowRight")) - Number(pressedKeys.has("KeyA") || pressedKeys.has("ArrowLeft"));
				desiredVelocity.set(0, 0, 0);
				if (cameraState.mode === 4) {
					desiredVelocity.x = sideways;
				} else {
					const forwardX = -Math.sin(cameraState.yaw);
					const forwardZ = -Math.cos(cameraState.yaw);
					desiredVelocity.x = forwardX * forward + Math.cos(cameraState.yaw) * sideways;
					desiredVelocity.z = forwardZ * forward - Math.sin(cameraState.yaw) * sideways;
				}

				if (desiredVelocity.lengthSq() > 1) desiredVelocity.normalize();
				desiredVelocity.multiplyScalar(2.4);
				const smoothing = 1 - Math.exp(-(desiredVelocity.lengthSq() > 0 ? 9 : 6) * delta);
				movementVelocity.lerp(desiredVelocity, smoothing);
				slime.position.x += movementVelocity.x * delta;
				slime.position.z += movementVelocity.z * delta;

				if (movementVelocity.lengthSq() > 0.0025) {
					const targetRotation = cameraState.mode === 4
						? (movementVelocity.x > 0 ? Math.PI / 3 : -Math.PI / 3)
						: Math.atan2(movementVelocity.x, movementVelocity.z);
					const rotationDelta = Math.atan2(
						Math.sin(targetRotation - slime.rotation.y),
						Math.cos(targetRotation - slime.rotation.y),
					);
					slime.rotation.y += rotationDelta * (1 - Math.exp(-12 * delta));
				}
			}

			const timer = new THREE.Timer();
			timer.connect(document);
			function animate(timestamp) {
				timer.update(timestamp);
				const time = timer.getElapsed();
				moveSlime(Math.min(timer.getDelta(), 0.05));
				slime.position.y = Math.sin(time * 1.7) * 0.055;
				slime.scale.y = 1 + Math.sin(time * 1.7 + 0.6) * 0.018;
				slime.rotation.z = Math.sin(time * 0.8) * 0.025;
				for (const arm of armPivots) {
					arm.group.rotation.z = arm.side * (0.08 + Math.sin(time * 2 + arm.side) * 0.07);
				}
				const forwardX = -Math.sin(cameraState.yaw);
				const forwardZ = -Math.cos(cameraState.yaw);
				if (cameraState.mode === 1) {
					fpsCamera.rotation.set(-cameraState.pitch, cameraState.yaw - slime.rotation.y, 0, "YXZ");
				} else if (cameraState.mode === 2) {
					const horizontalDistance = cameraState.distance * Math.cos(cameraState.pitch);
					camera.position.set(
						slime.position.x + Math.sin(cameraState.yaw) * horizontalDistance + Math.cos(cameraState.yaw) * 0.42,
						slime.position.y + 0.9 + Math.sin(cameraState.pitch) * cameraState.distance,
						slime.position.z + Math.cos(cameraState.yaw) * horizontalDistance - Math.sin(cameraState.yaw) * 0.42,
					);
					camera.lookAt(
						slime.position.x + forwardX * 1.05,
						slime.position.y + 0.82,
						slime.position.z + forwardZ * 1.05,
					);
				} else if (cameraState.mode === 3) {
					const offset = 11 / Math.sqrt(3);
					camera.position.set(slime.position.x + offset, slime.position.y + offset, slime.position.z + offset);
					camera.lookAt(slime.position.x, slime.position.y + 0.15, slime.position.z);
				} else {
					camera.position.set(slime.position.x, slime.position.y + 1.25, slime.position.z + 8);
					camera.lookAt(slime.position.x, slime.position.y + 0.05, slime.position.z);
				}
				renderer.render(scene, camera);
				requestAnimationFrame(animate);
			}

			animate();
		</script>
	</body>
</html>
